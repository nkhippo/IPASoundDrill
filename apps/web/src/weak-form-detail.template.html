<style>
  @font-face{
    font-family:"Doulos SIL";
    src:url("/fonts/DoulosSIL-Regular.woff2") format("woff2");
    font-weight:400; font-style:normal; font-display:block;
  }
  :root{
    --paper:#F5F1EA; --paper-2:#EAE3D6; --panel:#FBF8F1;
    --ink:#1F2933; --muted:#52606D; --faint:#7B8794; --hair:#D8CFBE;
    --signal:#0C7C7E; --signal-soft:#DCF0EF;
    --stress:#D9911B; --stress-soft:#F8ECD3;
    --font-serif:"Charis SIL","Noto Serif JP",Georgia,"Times New Roman",serif;
    --font-sans:"Helvetica Neue","Noto Sans JP","Noto Sans KR","Hiragino Sans",Arial,sans-serif;
    --font-ipa:"Doulos SIL","Charis SIL","Lucida Sans Unicode",serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font-sans);background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  .visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  a{color:var(--signal);text-decoration:none}
  a:hover{text-decoration:underline}

  .wf-wrap{max-width:820px;margin:0 auto;padding:24px 20px 80px}
  .wf-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:24px;font-size:14px}
  .wf-brand{font-family:var(--font-serif);font-weight:700;color:var(--ink);letter-spacing:.02em}
  .wf-brand a{color:inherit}
  .wf-crumb{color:var(--faint);font-size:13px}
  .wf-crumb a{color:var(--muted)}
  .wf-crumb span[aria-hidden]{margin:0 8px}

  .wf-hero{background:var(--panel);border:1px solid var(--hair);border-radius:14px;padding:36px 28px;text-align:center;margin-bottom:32px}
  .wf-hero-word{font-family:var(--font-serif);font-size:clamp(48px,12vw,80px);line-height:1;color:var(--ink);margin:0 0 18px;font-weight:600;letter-spacing:.02em}
  .wf-hero-cefr{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--stress-soft);color:var(--stress);font-size:12px;font-weight:700;letter-spacing:.06em;margin-bottom:14px}
  .wf-hero-forms{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px;text-align:left}
  .wf-hero-forms-card{border:1px solid var(--hair);border-radius:10px;padding:14px 16px;background:#fff}
  .wf-hero-forms-card.is-weak{border-color:var(--signal);background:var(--signal-soft)}
  .wf-hero-forms-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:4px}
  .wf-hero-forms-ipa{font-family:var(--font-ipa);font-size:22px;color:var(--ink);line-height:1.2}
  .wf-hero-forms-rp{font-family:var(--font-ipa);font-size:15px;color:var(--muted);margin-top:4px}

  .wf-audio{margin:22px 0 0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  .wf-listen{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid var(--signal);background:var(--signal-soft);color:var(--signal);border-radius:99px;font-family:var(--font-sans);font-size:14px;font-weight:600;cursor:pointer}
  .wf-listen:hover{background:var(--signal);color:#fff}
  .wf-listen[disabled]{opacity:.5;cursor:default}
  .wf-listen svg{width:15px;height:15px}

  .wf-section{margin:28px 0}
  .wf-section h2{font-family:var(--font-serif);font-size:20px;margin:0 0 12px;color:var(--ink)}
  .wf-section p{margin:0 0 8px;color:var(--ink)}

  .wf-rule{padding:14px 18px;background:var(--panel);border-left:3px solid var(--signal);border-radius:6px;color:var(--ink);font-size:15.5px}

  .wf-carriers{list-style:none;padding:0;margin:0}
  .wf-carriers li{padding:12px 0;border-bottom:1px dashed var(--hair);color:var(--ink)}
  .wf-carriers li:last-child{border-bottom:0}
  .wf-carriers .wf-word-hl{background:var(--signal-soft);color:var(--signal);font-weight:600;padding:0 4px;border-radius:3px}

  .wf-related{margin-top:32px;padding-top:24px;border-top:1px solid var(--hair)}
  .wf-related h2{font-family:var(--font-serif);font-size:18px;margin:0 0 14px}
  .wf-related-list{display:flex;flex-wrap:wrap;gap:10px;padding:0;margin:0;list-style:none}
  .wf-related-list a{display:inline-flex;align-items:baseline;gap:6px;padding:6px 12px;border:1px solid var(--hair);border-radius:99px;background:var(--panel);color:var(--ink);font-size:14px}
  .wf-related-list a:hover{background:var(--signal-soft);border-color:var(--signal);text-decoration:none}
  .wf-related-list .wf-ipa-mini{font-family:var(--font-ipa);color:var(--signal);font-size:15px}

  .wf-cta{margin-top:36px;padding:24px 20px;background:var(--panel);border:1px solid var(--hair);border-radius:14px;text-align:center}
  .wf-cta a{display:inline-block;padding:12px 28px;background:var(--ink);color:#fff;border-radius:99px;font-weight:600;font-size:15px}
  .wf-cta a:hover{background:var(--signal);text-decoration:none}
  .wf-cta-lead{margin:0 0 12px;color:var(--muted);font-size:14px}

  .wf-foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--hair);font-size:12px;color:var(--faint);text-align:center}
  .wf-foot a{color:var(--muted);margin:0 10px}
</style>
</head>
<body>
  <h1 class="visually-hidden"><!-- WF:SEO_H1 --></h1>

  <div class="wf-wrap">
    <div class="wf-top">
      <div class="wf-brand"><a href="<!-- WF:HOME_URL -->">IPA Sound Drill</a></div>
      <nav class="wf-crumb" aria-label="Breadcrumb">
        <a href="<!-- WF:HOME_URL -->"><!-- WF:CRUMB_HOME --></a>
        <span aria-hidden="true">›</span>
        <a href="<!-- WF:WEAKFORMS_URL -->"><!-- WF:CRUMB_ROOT --></a>
        <span aria-hidden="true">›</span>
        <span><!-- WF:WORD --></span>
      </nav>
    </div>

    <header class="wf-hero">
      <span class="wf-hero-cefr">CEFR <!-- WF:CEFR --></span>
      <p class="wf-hero-word"><!-- WF:WORD --></p>
      <div class="wf-hero-forms">
        <div class="wf-hero-forms-card is-weak">
          <p class="wf-hero-forms-label"><!-- WF:LBL_WEAK --></p>
          <p class="wf-hero-forms-ipa"><!-- WF:WEAK_IPA --></p>
          <p class="wf-hero-forms-rp"><!-- WF:LBL_RP -->: <!-- WF:RP_WEAK_IPA --></p>
        </div>
        <div class="wf-hero-forms-card">
          <p class="wf-hero-forms-label"><!-- WF:LBL_STRONG --></p>
          <p class="wf-hero-forms-ipa"><!-- WF:STRONG_IPA --></p>
          <p class="wf-hero-forms-rp"><!-- WF:LBL_RP -->: <!-- WF:RP_STRONG_IPA --></p>
        </div>
      </div>
      <div class="wf-audio">
        <button class="wf-listen" type="button" data-word="<!-- WF:WORD -->" data-accent="ga">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <span><!-- WF:BTN_LISTEN_GA --></span>
        </button>
        <button class="wf-listen" type="button" data-word="<!-- WF:WORD -->" data-accent="rp">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <span><!-- WF:BTN_LISTEN_RP --></span>
        </button>
      </div>
    </header>

    <section class="wf-section">
      <h2><!-- WF:SEC_RULE --></h2>
      <p class="wf-rule"><!-- WF:RULE --></p>
    </section>

    <section class="wf-section">
      <h2><!-- WF:SEC_EXAMPLES --></h2>
      <ul class="wf-carriers">
        <!-- WF:CARRIERS -->
      </ul>
    </section>

    <nav class="wf-related" aria-label="Related weak forms">
      <h2><!-- WF:REL_TITLE --></h2>
      <ul class="wf-related-list">
        <!-- WF:REL_LIST -->
      </ul>
    </nav>

    <aside class="wf-cta">
      <p class="wf-cta-lead"><!-- WF:CTA_LEAD --></p>
      <a href="<!-- WF:HOME_URL -->"><!-- WF:CTA_BUTTON --></a>
    </aside>

    <footer class="wf-foot">
      <a href="<!-- WF:HOME_URL -->"><!-- WF:BACK_TOP --></a>
      <a href="/terms.html">Terms</a>
      <a href="/privacy.html">Privacy</a>
    </footer>
  </div>

<script>
(function(){
  var GAS = "https://script.google.com/macros/s/AKfycbz-O44-1Nyi3rrEsBMYfwGeBK_DTGAH-ItOsamiHz8iFe4Kz2pnnowNatlb6LeZS8mE/exec";
  var audioCtx = null;
  document.querySelectorAll(".wf-listen").forEach(function(btn){
    btn.addEventListener("click", function() {
      var w = btn.getAttribute("data-word");
      var a = btn.getAttribute("data-accent") || "ga";
      if (!w) return;
      btn.disabled = true;
      fetch(GAS + "?word=" + encodeURIComponent(w) + "&accent=" + a)
        .then(function(r){ return r.arrayBuffer(); })
        .then(function(buf){
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          return audioCtx.decodeAudioData(buf);
        })
        .then(function(decoded){
          var src = audioCtx.createBufferSource();
          src.buffer = decoded;
          src.connect(audioCtx.destination);
          src.start(0);
          src.onended = function(){ btn.disabled = false; };
        })
        .catch(function(){ btn.disabled = false; });
    });
  });
})();
</script>

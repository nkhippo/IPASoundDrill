<style>
  @font-face{
    font-family:"Doulos SIL";
    src:url("/fonts/DoulosSIL-Regular.woff2") format("woff2");
    font-weight:400; font-style:normal; font-display:block;
  }
  :root{
    --paper:#F5F1EA; --paper-2:#EAE3D6; --panel:#FBF8F1;
    --ink:#1F2933; --muted:#52606D; --faint:#7B8794; --hair:#D8CFBE;
    --signal:#0C7C7E; --signal-soft:#DCF0EF;
    --stress:#D9911B; --stress-soft:#F8ECD3;
    --font-serif:"Charis SIL","Noto Serif JP",Georgia,"Times New Roman",serif;
    --font-sans:"Helvetica Neue","Noto Sans JP","Noto Sans KR","Hiragino Sans",Arial,sans-serif;
    --font-ipa:"Doulos SIL","Charis SIL","Lucida Sans Unicode",serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font-sans);background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  .visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  a{color:var(--signal);text-decoration:none}
  a:hover{text-decoration:underline}

  .sw-wrap{max-width:900px;margin:0 auto;padding:24px 20px 80px}
  .sw-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:24px;font-size:14px}
  .sw-brand{font-family:var(--font-serif);font-weight:700;color:var(--ink);letter-spacing:.02em}
  .sw-brand a{color:inherit}
  .sw-crumb{color:var(--faint);font-size:13px}
  .sw-crumb a{color:var(--muted)}
  .sw-crumb span[aria-hidden]{margin:0 8px}

  .sw-hero{background:var(--panel);border:1px solid var(--hair);border-radius:14px;padding:32px 26px;text-align:center;margin-bottom:24px}
  .sw-hero-ipa{font-family:var(--font-ipa);font-size:clamp(56px,14vw,90px);line-height:1;color:var(--signal);margin:0 0 10px}
  .sw-hero-label{font-family:var(--font-serif);font-size:clamp(20px,3.5vw,26px);color:var(--ink);margin:0 0 6px;font-weight:600}
  .sw-hero-sub{font-size:14px;color:var(--muted);margin:0}

  .sw-intro{padding:16px 20px;background:var(--panel);border-left:3px solid var(--signal);border-radius:6px;color:var(--ink);font-size:14.5px;margin:0 0 24px}

  .sw-table-wrap{overflow-x:auto;border:1px solid var(--hair);border-radius:10px;background:#fff;margin-bottom:24px}
  table.sw-tbl{width:100%;border-collapse:collapse;font-size:14.5px}
  .sw-tbl th{padding:12px 14px;text-align:left;background:var(--panel);color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--hair)}
  .sw-tbl td{padding:12px 14px;border-bottom:1px solid var(--hair);vertical-align:middle}
  .sw-tbl tr:last-child td{border-bottom:0}
  .sw-tbl .sw-w{font-family:var(--font-serif);font-weight:600;color:var(--ink);font-size:16px}
  .sw-tbl .sw-ipa{font-family:var(--font-ipa);color:var(--ink)}
  .sw-tbl .sw-cefr{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--stress-soft);color:var(--stress);font-size:11px;font-weight:700;letter-spacing:.06em}
  .sw-tbl .sw-listen{padding:6px 12px;border:1px solid var(--signal);background:var(--signal-soft);color:var(--signal);border-radius:99px;font-family:var(--font-sans);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .sw-tbl .sw-listen:hover{background:var(--signal);color:#fff}
  .sw-tbl .sw-listen[disabled]{opacity:.5;cursor:default}
  .sw-tbl .sw-listen svg{width:12px;height:12px}

  .sw-back{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
  .sw-back a{color:var(--signal);font-weight:600}

  .sw-cta{margin-top:36px;padding:24px 20px;background:var(--panel);border:1px solid var(--hair);border-radius:14px;text-align:center}
  .sw-cta a{display:inline-block;padding:12px 28px;background:var(--ink);color:#fff;border-radius:99px;font-weight:600;font-size:15px}
  .sw-cta a:hover{background:var(--signal);text-decoration:none}
  .sw-cta-lead{margin:0 0 12px;color:var(--muted);font-size:14px}

  .sw-empty{padding:24px;text-align:center;color:var(--muted);font-style:italic}

  .sw-foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--hair);font-size:12px;color:var(--faint);text-align:center}
  .sw-foot a{color:var(--muted);margin:0 10px}
</style>
</head>
<body>
  <h1 class="visually-hidden"><!-- SW:SEO_H1 --></h1>

  <div class="sw-wrap">
    <div class="sw-top">
      <div class="sw-brand"><a href="<!-- SW:HOME_URL -->">IPA Sound Drill</a></div>
      <nav class="sw-crumb" aria-label="Breadcrumb">
        <a href="<!-- SW:HOME_URL -->"><!-- SW:CRUMB_HOME --></a>
        <span aria-hidden="true">›</span>
        <a href="<!-- SW:SOUNDS_URL -->"><!-- SW:CRUMB_SOUNDS --></a>
        <span aria-hidden="true">›</span>
        <a href="<!-- SW:SOUND_URL -->"><!-- SW:IPA --></a>
        <span aria-hidden="true">›</span>
        <span><!-- SW:CRUMB_WORDS --></span>
      </nav>
    </div>

    <header class="sw-hero">
      <p class="sw-hero-ipa"><!-- SW:IPA --></p>
      <p class="sw-hero-label"><!-- SW:SEC_TITLE --></p>
      <p class="sw-hero-sub"><!-- SW:LABEL --></p>
    </header>

    <p class="sw-intro"><!-- SW:INTRO --></p>

    <!-- SW:TABLE -->

    <p class="sw-back">← <a href="<!-- SW:SOUND_URL -->"><!-- SW:BACK_TO_SOUND --></a></p>

    <aside class="sw-cta">
      <p class="sw-cta-lead"><!-- SW:CTA_LEAD --></p>
      <a href="<!-- SW:HOME_URL -->"><!-- SW:CTA_BUTTON --></a>
    </aside>

    <footer class="sw-foot">
      <a href="<!-- SW:HOME_URL -->"><!-- SW:BACK_TOP --></a>
      <a href="/terms.html">Terms</a>
      <a href="/privacy.html">Privacy</a>
    </footer>
  </div>

<script>
(function(){
  var GAS = "https://script.google.com/macros/s/AKfycbz-O44-1Nyi3rrEsBMYfwGeBK_DTGAH-ItOsamiHz8iFe4Kz2pnnowNatlb6LeZS8mE/exec";
  var audioCtx = null;
  document.querySelectorAll(".sw-listen").forEach(function(btn){
    btn.addEventListener("click", function() {
      var w = btn.getAttribute("data-word");
      var a = btn.getAttribute("data-accent") || "ga";
      if (!w) return;
      btn.disabled = true;
      fetch(GAS + "?word=" + encodeURIComponent(w) + "&accent=" + a)
        .then(function(r){ return r.arrayBuffer(); })
        .then(function(buf){
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          return audioCtx.decodeAudioData(buf);
        })
        .then(function(decoded){
          var src = audioCtx.createBufferSource();
          src.buffer = decoded;
          src.connect(audioCtx.destination);
          src.start(0);
          src.onended = function(){ btn.disabled = false; };
        })
        .catch(function(){ btn.disabled = false; });
    });
  });
})();
</script>
</body>
</html>

<style>
  @font-face{
    font-family:"Doulos SIL";
    src:url("/fonts/DoulosSIL-Regular.woff2") format("woff2");
    font-weight:400; font-style:normal; font-display:block;
  }
  :root{
    --paper:#F5F1EA; --paper-2:#EAE3D6; --panel:#FBF8F1;
    --ink:#1F2933; --muted:#52606D; --faint:#7B8794; --hair:#D8CFBE;
    --signal:#0C7C7E; --signal-soft:#DCF0EF;
    --stress:#D9911B; --stress-soft:#F8ECD3;
    --font-serif:"Charis SIL","Noto Serif JP",Georgia,"Times New Roman",serif;
    --font-sans:"Helvetica Neue","Noto Sans JP","Noto Sans KR","Hiragino Sans",Arial,sans-serif;
    --font-ipa:"Doulos SIL","Charis SIL","Lucida Sans Unicode",serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font-sans);background:var(--paper);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  .visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  a{color:var(--signal);text-decoration:none}
  a:hover{text-decoration:underline}

  .ph-wrap{max-width:820px;margin:0 auto;padding:24px 20px 80px}
  .ph-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:24px;font-size:14px}
  .ph-brand{font-family:var(--font-serif);font-weight:700;color:var(--ink);letter-spacing:.02em}
  .ph-brand a{color:inherit}
  .ph-crumb{color:var(--faint);font-size:13px}
  .ph-crumb a{color:var(--muted)}
  .ph-crumb span[aria-hidden]{margin:0 8px}

  .ph-hero{background:var(--panel);border:1px solid var(--hair);border-radius:14px;padding:36px 28px;text-align:center;margin-bottom:32px}
  .ph-hero-badges{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
  .ph-badge{display:inline-block;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .ph-badge.is-cefr{background:var(--stress-soft);color:var(--stress)}
  .ph-badge.is-type{background:var(--signal-soft);color:var(--signal)}
  .ph-hero-phrase{font-family:var(--font-serif);font-size:clamp(36px,9vw,60px);line-height:1.15;color:var(--ink);margin:0 0 12px;font-weight:600;letter-spacing:.01em}
  .ph-hero-ipa{font-family:var(--font-ipa);font-size:clamp(22px,5vw,32px);color:var(--signal);margin:0 0 6px;line-height:1.3}
  .ph-hero-rp{font-family:var(--font-ipa);font-size:16px;color:var(--muted);margin:0}
  .ph-hero-gloss{margin-top:14px;font-size:14px;color:var(--muted);font-style:italic}

  .ph-audio{margin:22px 0 0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  .ph-listen{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border:1px solid var(--signal);background:var(--signal-soft);color:var(--signal);border-radius:99px;font-family:var(--font-sans);font-size:14px;font-weight:600;cursor:pointer}
  .ph-listen:hover{background:var(--signal);color:#fff}
  .ph-listen[disabled]{opacity:.5;cursor:default}
  .ph-listen svg{width:15px;height:15px}

  .ph-section{margin:28px 0}
  .ph-section h2{font-family:var(--font-serif);font-size:20px;margin:0 0 12px;color:var(--ink)}
  .ph-section p{margin:0 0 8px;color:var(--ink)}
  .ph-rule{padding:14px 18px;background:var(--panel);border-left:3px solid var(--signal);border-radius:6px;color:var(--ink);font-size:15.5px}

  .ph-carriers{list-style:none;padding:0;margin:0}
  .ph-carriers li{padding:12px 0;border-bottom:1px dashed var(--hair);color:var(--ink)}
  .ph-carriers li:last-child{border-bottom:0}
  .ph-carriers .ph-word-hl{background:var(--signal-soft);color:var(--signal);font-weight:600;padding:0 4px;border-radius:3px}

  .ph-related{margin-top:32px;padding-top:24px;border-top:1px solid var(--hair)}
  .ph-related h2{font-family:var(--font-serif);font-size:18px;margin:0 0 14px}
  .ph-related-list{display:flex;flex-wrap:wrap;gap:10px;padding:0;margin:0;list-style:none}
  .ph-related-list a{display:inline-flex;align-items:baseline;gap:6px;padding:6px 12px;border:1px solid var(--hair);border-radius:99px;background:var(--panel);color:var(--ink);font-size:14px}
  .ph-related-list a:hover{background:var(--signal-soft);border-color:var(--signal);text-decoration:none}
  .ph-related-list .ph-ipa-mini{font-family:var(--font-ipa);color:var(--signal);font-size:15px}

  .ph-cta{margin-top:36px;padding:24px 20px;background:var(--panel);border:1px solid var(--hair);border-radius:14px;text-align:center}
  .ph-cta a{display:inline-block;padding:12px 28px;background:var(--ink);color:#fff;border-radius:99px;font-weight:600;font-size:15px}
  .ph-cta a:hover{background:var(--signal);text-decoration:none}
  .ph-cta-lead{margin:0 0 12px;color:var(--muted);font-size:14px}

  .ph-foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--hair);font-size:12px;color:var(--faint);text-align:center}
  .ph-foot a{color:var(--muted);margin:0 10px}
</style>
</head>
<body>
  <h1 class="visually-hidden"><!-- PH:SEO_H1 --></h1>

  <div class="ph-wrap">
    <div class="ph-top">
      <div class="ph-brand"><a href="<!-- PH:HOME_URL -->">IPA Sound Drill</a></div>
      <nav class="ph-crumb" aria-label="Breadcrumb">
        <a href="<!-- PH:HOME_URL -->"><!-- PH:CRUMB_HOME --></a>
        <span aria-hidden="true">›</span>
        <a href="<!-- PH:PHRASES_URL -->"><!-- PH:CRUMB_ROOT --></a>
        <span aria-hidden="true">›</span>
        <span><!-- PH:PHRASE --></span>
      </nav>
    </div>

    <header class="ph-hero">
      <div class="ph-hero-badges">
        <span class="ph-badge is-cefr">CEFR <!-- PH:CEFR --></span>
        <span class="ph-badge is-type"><!-- PH:CS_TYPE_LABEL --></span>
      </div>
      <p class="ph-hero-phrase"><!-- PH:PHRASE --></p>
      <p class="ph-hero-ipa"><!-- PH:IPA --></p>
      <p class="ph-hero-rp"><!-- PH:LBL_RP -->: <!-- PH:RP_IPA --></p>
      <!-- PH:GLOSS_BLOCK -->
      <div class="ph-audio">
        <button class="ph-listen" type="button" data-word="<!-- PH:PHRASE -->" data-accent="ga">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <span><!-- PH:BTN_LISTEN_GA --></span>
        </button>
        <button class="ph-listen" type="button" data-word="<!-- PH:PHRASE -->" data-accent="rp">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <span><!-- PH:BTN_LISTEN_RP --></span>
        </button>
      </div>
    </header>

    <section class="ph-section">
      <h2><!-- PH:SEC_RULE --></h2>
      <p class="ph-rule"><!-- PH:RULE --></p>
    </section>

    <section class="ph-section">
      <h2><!-- PH:SEC_EXAMPLES --></h2>
      <ul class="ph-carriers">
        <!-- PH:CARRIERS -->
      </ul>
    </section>

    <nav class="ph-related" aria-label="Related phrases">
      <h2><!-- PH:REL_TITLE --></h2>
      <ul class="ph-related-list">
        <!-- PH:REL_LIST -->
      </ul>
    </nav>

    <aside class="ph-cta">
      <p class="ph-cta-lead"><!-- PH:CTA_LEAD --></p>
      <a href="<!-- PH:HOME_URL -->"><!-- PH:CTA_BUTTON --></a>
    </aside>

    <footer class="ph-foot">
      <a href="<!-- PH:HOME_URL -->"><!-- PH:BACK_TOP --></a>
      <a href="/terms.html">Terms</a>
      <a href="/privacy.html">Privacy</a>
    </footer>
  </div>

<script>
(function(){
  var GAS = "https://script.google.com/macros/s/AKfycbz-O44-1Nyi3rrEsBMYfwGeBK_DTGAH-ItOsamiHz8iFe4Kz2pnnowNatlb6LeZS8mE/exec";
  var audioCtx = null;
  document.querySelectorAll(".ph-listen").forEach(function(btn){
    btn.addEventListener("click", function() {
      var w = btn.getAttribute("data-word");
      var a = btn.getAttribute("data-accent") || "ga";
      if (!w) return;
      btn.disabled = true;
      fetch(GAS + "?word=" + encodeURIComponent(w) + "&accent=" + a)
        .then(function(r){ return r.arrayBuffer(); })
        .then(function(buf){
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          return audioCtx.decodeAudioData(buf);
        })
        .then(function(decoded){
          var src = audioCtx.createBufferSource();
          src.buffer = decoded;
          src.connect(audioCtx.destination);
          src.start(0);
          src.onended = function(){ btn.disabled = false; };
        })
        .catch(function(){ btn.disabled = false; });
    });
  });
})();
</script>

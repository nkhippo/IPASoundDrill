<?xml version="1.0" encoding="UTF-8"?>
<!--
  IPA Sound Drill — placeholder app icon (Issue #225, v1 仮アイコン)
  1024x1024 square. Naoya が v1.1 で本番アイコンに差し替え予定。
  Motif: 音波 (sound wave) + IPA 文字 [aɪ]
  Palette: primary #4A90E2 (blue), accent #F5A623 (orange)
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="100%" stop-color="#357ABD" />
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="192" fill="url(#bg)" />

  <!-- sound wave bars -->
  <g stroke="#FFFFFF" stroke-width="36" stroke-linecap="round">
    <line x1="272" y1="452" x2="272" y2="572" />
    <line x1="368" y1="392" x2="368" y2="632" />
    <line x1="464" y1="332" x2="464" y2="692" />
    <line x1="560" y1="392" x2="560" y2="632" />
    <line x1="656" y1="452" x2="656" y2="572" />
  </g>

  <!-- accent dot (radiating sound) -->
  <circle cx="752" cy="512" r="20" fill="#F5A623" />

  <!-- IPA text [aɪ] -->
  <text x="512" y="820" font-family="Georgia, 'Times New Roman', serif" font-size="128"
        font-style="italic" fill="#F5A623" text-anchor="middle">[aɪ]</text>
</svg>
